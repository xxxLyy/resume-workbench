<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>高级前端工程师 - 示例科技招聘</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "JobPosting",
  "title": "高级前端工程师",
  "description": "<p>岗位职责：</p><ul><li>负责公司核心产品的前端架构设计与开发；</li><li>与产品、设计、后端协作，交付高质量的用户界面；</li><li>持续优化页面性能与可访问性，建设前端工程化体系。</li></ul><p>岗位要求：三年以上前端开发经验，熟悉 React 生态与 TypeScript，有大型单页应用性能优化经验者优先。</p>",
  "hiringOrganization": {
    "@type": "Organization",
    "name": "示例科技有限公司",
    "sameAs": "https://example.com"
  },
  "jobLocation": {
    "@type": "Place",
    "address": { "@type": "PostalAddress", "addressLocality": "深圳" }
  },
  "baseSalary": {
    "@type": "MonetaryAmount",
    "currency": "CNY",
    "value": { "@type": "QuantitativeValue", "minValue": 25000, "maxValue": 40000, "unitText": "MONTH" }
  }
}
</script>
</head>
<body>
<div class="page">
  <h1>高级前端工程师</h1>
  <p>深圳 · 3-5年 · 本科</p>
  <div class="desc">见结构化数据</div>
</div>
</body>
</html>
